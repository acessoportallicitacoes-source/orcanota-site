  body { margin: 0; background: var(--fundo); color: var(--tinta); font: 16px/1.5 Inter, system-ui, sans-serif; }
  main { display: flex; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px 16px 40px; flex-wrap: wrap; }
  figure { margin: 0; width: min(100%, 430px); }
  figcaption { margin-top: 12px; color: var(--suave); font-size: 14px; }
  figcaption b { color: var(--tinta); display: block; font-size: 16px; }
  .quadro { position: relative; aspect-ratio: 1536 / 2752; overflow: hidden; border-radius: 6px; container-type: inline-size; }
  .quadro > img.foto { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* tela do celular: retângulo medido na foto A */
  .tela { position: absolute; left: 35.16%; top: 32.61%; width: 29.88%; height: 36.97%; border-radius: 9.5% / 4.3%; overflow: hidden; background: #F4F6F9; }
  .tela img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: top; }
  .tela::after { content: ""; position: absolute; left: 50%; top: 1.15%; width: 5.6%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: #05070a; }
  /* na foto B a folha cobre o topo do celular: a tela só aparece da parte de baixo */
  .tela.baixo { clip-path: polygon(0 66.5%, 100% 64.3%, 100% 100%, 0 100%); }
  /* folha: o documento entra deformado nos quatro cantos medidos, multiplicado sobre o papel */
  .folha { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; transform-origin: 0 0; mix-blend-mode: multiply; pointer-events: none; }
</style>

<script>
// Cantos da folha na foto B, em fração da imagem (tl, tr, br, bl)
const CANTOS = [[0.2007, 0.1453], [0.7389, 0.1196], [0.8081, 0.5452], [0.2624, 0.5717]];
const FW = 794, FH = 1123;

// Resolve a homografia que leva o retângulo FW x FH aos quatro cantos (em px) e devolve um matrix3d
function matriz(dst) {
  const src = [[0, 0], [FW, 0], [FW, FH], [0, FH]];
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  // eliminação de Gauss
  for (let c = 0; c < 8; c++) {
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
    for (let r = c + 1; r < 8; r++) {
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  const h = new Array(8);
  for (let r = 7; r >= 0; r--) {
    let s = b[r];
    for (let k = r + 1; k < 8; k++) s -= A[r][k] * h[k];
    h[r] = s / A[r][r];
  }
  return `matrix3d(${h[0]},${h[3]},0,${h[6]}, ${h[1]},${h[4]},0,${h[7]}, 0,0,1,0, ${h[2]},${h[5]},0,1)`;
}

function aplica() {
  const q = document.getElementById('quadro-b').getBoundingClientRect();
  document.getElementById('folha').style.transform = matriz(CANTOS.map(([x, y]) => [x * q.width, y * q.height]));
}
// Rascunho do vídeo: a barra faz o papel da rolagem
const video = document.getElementById('rascunho'), barra = document.getElementById('rolagem');
let alvo = 0, pendente = false;
function vai() { pendente = false; if (video.duration) video.currentTime = Math.min(video.duration - 0.03, alvo * video.duration); }
barra.addEventListener('input', () => { video.pause(); alvo = barra.value / 1000; if (!pendente) { pendente = true; requestAnimationFrame(vai); } });
document.getElementById('tocar').addEventListener('click', () => { video.currentTime = 0; video.play(); });
video.addEventListener('timeupdate', () => { if (!video.paused) barra.value = Math.round(video.currentTime / video.duration * 1000); });

// ?foto=a|b&largura=1000 mostra uma foto só, grande (para conferir os detalhes)
const par = new URLSearchParams(location.search);
if (par.get('foto')) {
  const figs = document.querySelectorAll('main > figure');
  figs[par.get('foto') === 'a' ? 1 : 0].style.display = 'none';
  document.querySelector('main').style.cssText = 'display:block;padding:0';
  figs[par.get('foto') === 'a' ? 0 : 1].style.width = (par.get('largura') || 1000) + 'px';
}
addEventListener('resize', aplica);
aplica();
</script>
